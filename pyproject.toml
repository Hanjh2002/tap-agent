[project]
name = "tap"
version = "0.2.0"
description = "A mini coding agent for the terminal, inspired by `tau`."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "numpy>=2.5.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tensorflow>=2.21.0",
    "truststore>=0.10.4",
]

[project.scripts]
tap = "tap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tap"]
